services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: linq
      POSTGRES_PASSWORD: linq
      POSTGRES_DB: linq
    ports:
      - "5432:5432"
    volumes:
      - linq_project_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linq"]
      interval: 2s
      timeout: 2s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  linq_project_data: